    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('cyut_app_settings');
          if (raw) {
            var s = JSON.parse(raw);
            if (s.colorMode === 'light') {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
            if (s.accentTheme) {
              document.documentElement.setAttribute('data-accent', s.accentTheme);
            }
            var pxMap = { standard: '16px', medium: '17.5px', large: '19px' };
            if (s.fontSize && pxMap[s.fontSize]) {
              document.documentElement.style.fontSize = pxMap[s.fontSize];
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0B0F17] dark:text-slate-100 antialiased">
